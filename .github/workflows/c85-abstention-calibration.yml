name: C8.5 Local Cross-Encoder Abstention Calibration

on:
  workflow_dispatch:

concurrency:
  group: c85-abstention-calibration
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  C85_IMAGE: ghcr.io/rezkyauliapratama/nyawa/bge-runtime@sha256:57fb872aca5dd9bf24547d33d920787fb6fef73a8f6e63087f8e785fc27c2fea
  C85_CONTAINER: nyawa-c85-eval-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  calibration:
    name: Synthetic C8.5 local cross-encoder calibration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate C8.5 fixture and validate evaluator
        run: |
          FIXTURE="$RUNNER_TEMP/c85-abstention-fixtures.json"
          python3 -m py_compile \
            scripts/c81_fixture_generator.py \
            scripts/c83_fixture_generator.py \
            scripts/c84_fixture_generator.py \
            scripts/c85_fixture_generator.py \
            scripts/c81_abstention_calibration.py
          python3 scripts/c85_fixture_generator.py --output "$FIXTURE"
          python3 scripts/c81_abstention_calibration.py --mode self-test --fixtures "$FIXTURE"

      - name: Check runner capacity before any container starts
        run: python3 scripts/c81_abstention_calibration.py --mode preflight

      - name: Authenticate to GHCR for package read
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pinned C8.5 runtime and run synthetic calibration
        run: |
          python3 scripts/c81_abstention_calibration.py \
            --mode e2e \
            --image "$C85_IMAGE" \
            --container "$C85_CONTAINER" \
            --fixtures "$RUNNER_TEMP/c85-abstention-fixtures.json"

      - name: Final cleanup verification
        if: always()
        run: |
          if docker inspect "$C85_CONTAINER" >/dev/null 2>&1; then
            image="$(docker inspect --format '{{.Config.Image}}' "$C85_CONTAINER")"
            owned="$(docker inspect --format '{{index .Config.Labels \"org.nyawa.abstention-calibration\"}}' "$C85_CONTAINER")"
            if [[ "$image" != "$C85_IMAGE" || "$owned" != "true" ]]; then
              echo "::error::refusing to remove a container not created by this C8.5 run"
              exit 1
            fi
            docker rm --force "$C85_CONTAINER" >/dev/null
          fi
          if docker inspect "$C85_CONTAINER" >/dev/null 2>&1; then
            echo "::error::disposable C8.5 container remains after cleanup"
            exit 1
          fi
          echo "Disposable C8.5 container absent after cleanup."
