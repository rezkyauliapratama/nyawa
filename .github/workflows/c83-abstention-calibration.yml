name: C8.3 Fresh Abstention Calibration

on:
  workflow_dispatch:

concurrency:
  group: c83-abstention-calibration
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  C83_IMAGE: ghcr.io/rezkyauliapratama/nyawa/bge-runtime@sha256:70b2935609973314d85f587f71f75cb44bd9f0a587a85f9d0457fbd988593495
  C83_CONTAINER: nyawa-c83-eval-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  calibration:
    name: Synthetic C8.3 fresh-holdout calibration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fresh C8.3 fixture and validate evaluator
        run: |
          FIXTURE="$RUNNER_TEMP/c83-abstention-fixtures.json"
          python3 -m py_compile scripts/c81_fixture_generator.py scripts/c83_fixture_generator.py scripts/c81_abstention_calibration.py
          python3 scripts/c83_fixture_generator.py --output "$FIXTURE"
          python3 scripts/c81_abstention_calibration.py --mode self-test --fixtures "$FIXTURE"

      - name: Check runner capacity before any container starts
        run: python3 scripts/c81_abstention_calibration.py --mode preflight

      - name: Authenticate to GHCR for package read
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pinned fixed-rank BGE image and run C8.3
        run: |
          python3 scripts/c81_abstention_calibration.py \
            --mode e2e \
            --image "$C83_IMAGE" \
            --container "$C83_CONTAINER" \
            --fixtures "$RUNNER_TEMP/c83-abstention-fixtures.json"

      - name: Final cleanup verification
        if: always()
        run: |
          if docker inspect "$C83_CONTAINER" >/dev/null 2>&1; then
            image="$(docker inspect --format '{{.Config.Image}}' "$C83_CONTAINER")"
            owned="$(docker inspect --format '{{index .Config.Labels \"org.nyawa.abstention-calibration\"}}' "$C83_CONTAINER")"
            if [[ "$image" != "$C83_IMAGE" || "$owned" != "true" ]]; then
              echo "::error::refusing to remove a container not created by this C8.3 run"
              exit 1
            fi
            docker rm --force "$C83_CONTAINER" >/dev/null
          fi
          if docker inspect "$C83_CONTAINER" >/dev/null 2>&1; then
            echo "::error::disposable C8.3 container remains after cleanup"
            exit 1
          fi
          echo "Disposable C8.3 container absent after cleanup."
