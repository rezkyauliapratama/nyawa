name: Nyawa BGE runtime static validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/**"
      - "internal/embedder/**"
      - "internal/rag/**"
      - "internal/search/**"
      - "internal/server/**"
      - "internal/types/**"
      - "cmd/nyawa/main.go"
      - "scripts/validate-bge-runtime.py"
      - "scripts/test-bge-handshake.py"
      - "scripts/test-reranker-handshake.py"
      - "scripts/c81_abstention_calibration.py"
      - "scripts/c85_fixture_generator.py"
      - "scripts/c86_fixture_generator.py"
      - "scripts/c86_qwen_answerability.py"
      - "scripts/requirements-c86-qwen-ci.txt"
      - "docs/c8.6-qwen-answerability-pilot.md"
      - ".github/workflows/c86-abstention-calibration.yml"
      - ".github/workflows/c86-qwen-answerability-pilot.yml"
      - ".dockerignore"
      - ".github/workflows/bge-runtime-static.yml"
      - ".github/workflows/bge-runtime-publish.yml"
      - ".github/workflows/c85-abstention-calibration.yml"
      - ".github/workflows/go-test.yml"

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax, runtime contract, and JSONL handshake
        run: |
          python3 -m py_compile internal/embedder/bge_server.py internal/rag/reranker.py scripts/validate-bge-runtime.py scripts/test-bge-handshake.py scripts/test-reranker-handshake.py scripts/c81_fixture_generator.py scripts/c84_fixture_generator.py scripts/c85_fixture_generator.py scripts/c86_fixture_generator.py scripts/c81_abstention_calibration.py scripts/c86_qwen_answerability.py
          python3 scripts/validate-bge-runtime.py
          python3 scripts/test-bge-handshake.py
          python3 scripts/test-reranker-handshake.py
          FIXTURE="$RUNNER_TEMP/c85-fixtures.json"
          python3 scripts/c85_fixture_generator.py --output "$FIXTURE"
          python3 scripts/c81_abstention_calibration.py --mode self-test --fixtures "$FIXTURE"
          C86_FIXTURE="$RUNNER_TEMP/c86-fixtures.json"
          python3 scripts/c86_fixture_generator.py --output "$C86_FIXTURE"
          python3 scripts/c81_abstention_calibration.py --mode self-test --fixtures "$C86_FIXTURE"
          python3 scripts/c86_qwen_answerability.py --mode self-test
      - name: Validate Go formatting and source diff
        run: |
          test "$(gofmt -d cmd/nyawa/main.go internal/embedder/py_embedder.go internal/embedder/py_embedder_socket_test.go internal/embedder/modeldir_test.go internal/rag/reranker.go internal/rag/reranker_test.go internal/rag/store.go internal/server/recall_test.go)" = ""
          git diff --check

  qwen-calibration:
    if: github.event_name == 'pull_request'
    name: Qwen answerability calibration only (holdout frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      C86_IMAGE: ghcr.io/rezkyauliapratama/nyawa/bge-runtime@sha256:57fb872aca5dd9bf24547d33d920787fb6fef73a8f6e63087f8e785fc27c2fea
      C86_CONTAINER: nyawa-c86-qwen-pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-c86-qwen-ci.txt
      - name: Install pinned CPU-only Qwen dependencies
        run: python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu -r scripts/requirements-c86-qwen-ci.txt
      - name: Authenticate to GHCR for the pinned retrieval runtime
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate calibration fixture and run Qwen-only pilot
        timeout-minutes: 15
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          FIXTURE="$RUNNER_TEMP/c86-qwen-calibration-fixtures.json"
          python3 scripts/c86_fixture_generator.py --output "$FIXTURE"
          python3 scripts/c86_qwen_answerability.py \
            --mode calibration-only \
            --image "$C86_IMAGE" \
            --container "$C86_CONTAINER" \
            --fixtures "$FIXTURE"
      - name: Final disposable runtime cleanup verification
        if: always()
        run: |
          if docker inspect "$C86_CONTAINER" >/dev/null 2>&1; then
            image="$(docker inspect --format '{{.Config.Image}}' "$C86_CONTAINER")"
            owned="$(docker inspect --format '{{json .Config.Labels}}' "$C86_CONTAINER" | python3 -c 'import json,sys; print((json.load(sys.stdin) or {}).get("org.nyawa.abstention-calibration", ""))')"
            if [[ "$image" != "$C86_IMAGE" || "$owned" != "true" ]]; then
              echo "::error::refusing to remove a container not created by this Qwen calibration run"
              exit 1
            fi
            docker rm --force "$C86_CONTAINER" >/dev/null
          fi
          if docker inspect "$C86_CONTAINER" >/dev/null 2>&1; then
            echo "::error::Qwen calibration container remains after cleanup"
            exit 1
          fi
          echo "Disposable Qwen calibration container absent after cleanup."
