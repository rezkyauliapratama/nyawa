name: Publish Nyawa Embedded BGE Runtime

on:
  push:
    tags:
      - "bge-v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag, for example bge-v1.2.4-r5"
        required: true
        default: "bge-v1.2.4"
        type: string
      include_reranker:
        description: "Include the pinned local multilingual cross-encoder for synthetic calibration"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/bge-runtime
  IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}

jobs:
  publish:
    name: Build and push embedded BGE runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PAT_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Normalize image tag to runtime semver
        id: version
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          case "${IMAGE_TAG}" in
            bge-v[0-9]*)
              release_version="${IMAGE_TAG#bge-v}"
              ;;
            *)
              echo "::error::image tag must match bge-v<semver> or bge-v<semver>-r<number>: ${IMAGE_TAG}"
              exit 1
              ;;
          esac
          if [[ "${release_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-r[0-9]+$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          elif [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::image tag does not contain a supported semver: ${IMAGE_TAG}"
            exit 1
          fi
          printf 'release_version=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"
          echo "${IMAGE_TAG} -> runtime version ${release_version}"

      - name: Download and verify model asset
        env:
          MODEL_URL: https://github.com/${{ github.repository }}/releases/download/bge-model-v1.2.4/model.onnx
          MODEL_SHA256: 66fc00f5f29afcaff34092e1bdd20008ca3918265a82fb9695a551e510cc4ebc
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output runtime/model/model.onnx "${MODEL_URL}"
          echo "${MODEL_SHA256}  runtime/model/model.onnx" | sha256sum --check --strict

      - name: Download and verify local multilingual reranker
        if: ${{ inputs.include_reranker == true }}
        env:
          RERANKER_REVISION: 23139fec6f1f448cdf89a5ac2d2c6bf5e8c7b398
          RERANKER_MODEL_SHA256: f913154682468bfe92d6a7e02ed4e994e548c112fddc74452b573b17c949046e
          RERANKER_TOKENIZER_SHA256: 7925f638b5444897efe3b4608eed56c1652f0ed39c2662c8302de1bc264c6088
        run: |
          set -euo pipefail
          model_dir=runtime/model/reranker
          mkdir -p "${model_dir}"
          curl --fail --location --retry 3 --output "${model_dir}/model_quantized.onnx" \
            "https://huggingface.co/Horizon-Labs/multilingual-reranker-small/resolve/${RERANKER_REVISION}/onnx/model_quantized.onnx"
          curl --fail --location --retry 3 --output "${model_dir}/tokenizer.json" \
            "https://huggingface.co/Horizon-Labs/multilingual-reranker-small/resolve/${RERANKER_REVISION}/tokenizer.json"
          echo "${RERANKER_MODEL_SHA256}  ${model_dir}/model_quantized.onnx" | sha256sum --check --strict
          echo "${RERANKER_TOKENIZER_SHA256}  ${model_dir}/tokenizer.json" | sha256sum --check --strict

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha
          labels: |
            org.opencontainers.image.title=Nyawa Embedded BGE Runtime
            org.opencontainers.image.description=Self-contained Nyawa runtime with local BGE embeddings
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.nyawa.cross-encoder.enabled=${{ inputs.include_reranker || false }}
            io.nyawa.cross-encoder.model=Horizon-Labs/multilingual-reranker-small@23139fec6f1f448cdf89a5ac2d2c6bf5e8c7b398

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          push: true
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.release_version }}
            INCLUDE_RERANKER=${{ inputs.include_reranker || false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bge-runtime
          cache-to: type=gha,mode=max,scope=bge-runtime
          provenance: true
          sbom: true
